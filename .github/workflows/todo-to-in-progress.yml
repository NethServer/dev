name: Move ToDo Issues with Open PRs to In Progress

on:
  schedule:
    - cron: "0 5 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report the issues that would be moved"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  todo-to-in-progress:
    runs-on: ubuntu-latest
    env:
      OWNER: ${{ github.repository_owner }}
      PROJECT_NUMBER: 8

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Move ToDo issues with open PRs to In Progress
        run: |
          scripts/todo_to_in_progress.sh --owner "$OWNER" --project-number "$PROJECT_NUMBER" \
            ${{ inputs.dry_run && '--dry-run' || '' }} | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ secrets.PROJECT_STATUS_BOT_TOKEN }}
